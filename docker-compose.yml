services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    container_name: cloudnotes-api
    depends_on:
      - db
    volumes:
      - .:/app
      - ./logs:/app/logs
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: cloudnotes-nginx
    depends_on:
      - api
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

