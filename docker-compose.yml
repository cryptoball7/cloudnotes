services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: clouduser
      POSTGRES_PASSWORD: cloudpass
      POSTGRES_DB: cloudnotes
    ports:
      - "5433:5432"


  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    container_name: cloudnotes-api
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://clouduser:cloudpass@db:5432/cloudnotes
    volumes:
      - .:/app

  nginx:
    image: nginx:latest
    container_name: cloudnotes-nginx
    depends_on:
      - api
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro

